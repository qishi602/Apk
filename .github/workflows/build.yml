name: Build Android APK

on:
  workflow_dispatch: # 讓你可以用手機手動按鈕觸發

jobs:
  buildForAndroid:
    name: Build for Android 🤖
    runs-on: ubuntu-latest
    steps:
      # 1. 下載專案原始碼
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. 快取 Library 加速下次打包
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      # 3. 呼叫 Game-CI 雲端 Unity 開始編譯 APK
      - name: Run Unity Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.6f1 # 👈 ⚠️務必改成與你 ProjectVersion.txt 一致的 Unity 版本
          androidAppBundle: false # 產出 .apk 而非 .aab
          
      # 4. 上傳 APK 到 GitHub 伺服器供手機下載
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-Android
          path: build/Android
